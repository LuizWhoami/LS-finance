{% extends 'client/base.html' %}
{% load static %}

{% block title %}Login - Cliente{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card form-card">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">
                        <i class="fas fa-sign-in-alt"></i> Entrar
                    </h4>
                </div>
                <div class="card-body">
                    <form method="post" action="{% url 'client:login' %}">
                        {% csrf_token %}
                        
                        {% if form.non_field_errors %}
                        <div class="alert alert-danger">
                            {{ form.non_field_errors }}
                        </div>
                        {% endif %}
                        
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                <i class="fas fa-user"></i> Usuário
                            </label>
                            <input type="text" name="username" id="username" class="form-control" 
                                   value="{{ form.username.value|default:'' }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock"></i> Senha
                            </label>
                            <input type="password" name="password" id="password" class="form-control" required>
                        </div>
                        
                        <input type="hidden" name="next" value="{{ next }}">
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-submit">
                                <i class="fas fa-sign-in-alt"></i> Entrar
                            </button>
                        </div>
                    </form>
                    
                    <hr>
                    
                    <div class="text-center">
                        <p class="mb-0">Ainda não tem uma conta?</p>
                        <a href="{% url 'client:register' %}" class="btn btn-outline-primary btn-sm mt-2">
                            <i class="fas fa-user-plus"></i> Cadastrar-se
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
